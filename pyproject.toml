[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volatility-intelligence-platform"
version = "0.1.0"
description = "Research platform for forecasting realized volatility and screening predictive factors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomer" }]
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "typer>=0.12",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "pytest-mock>=3.14",
]
nonlinear = [
    "lightgbm>=4.0",
    "shap>=0.44"
]

[project.scripts]
vip = "vip.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vip"]

[tool.hatch.build.targets.sdist]
include = [
    "src/vip",
    "configs",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["vip"]